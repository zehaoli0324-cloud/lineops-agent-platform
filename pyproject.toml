[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lineops-agent-platform"
version = "0.1.0"
description = "Stateful industrial maintenance sandbox and tool-calling agent runtime"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "numpy>=1.26,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
figures = ["CairoSVG>=2.7,<3"]
optical = ["scipy>=1.11,<2", "numba>=0.60,<1", "tqdm>=4,<5"]
mqtt = ["paho-mqtt>=2,<3"]

[project.scripts]
lineops = "lineops.cli:main"

[tool.setuptools.packages.find]
include = ["lineops*"]

[tool.setuptools.package-data]
lineops = ["static/*.html"]
