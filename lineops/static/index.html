<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LineOps | 事件工作台</title><style>*{box-sizing:border-box}body{margin:0;background:#eff3f8;color:#15314c;font:15px/1.6 system-ui,sans-serif}main{max-width:1140px;padding:32px;margin:auto}h1{font-size:32px}section{background:white;padding:24px;margin:18px 0;border:1px solid #d4deeb;border-radius:12px}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:end}label{display:grid;gap:5px}button,select{padding:10px 15px;border:1px solid #bbc9da;border-radius:6px;font:inherit;background:white}button{cursor:pointer}button.primary{background:#126d7b;color:white}button:disabled{opacity:.5}#evidence{display:flex;flex-wrap:wrap;gap:20px}figure{margin:0}img{max-width:100%;width:320px;border-radius:8px}figcaption{font-size:12px;color:#596f85;max-width:320px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e1e8f1}pre{white-space:pre-wrap;word-break:break-word;max-height:400px;overflow:auto;background:#f2f5f9;padding:18px}summary{cursor:pointer}#status{font-weight:700;color:#126d7b}small{color:#5a6f85}</style><main><small>LINEOPS · LOCAL SANDBOX · v0.1</small><h1>设备运维事件工作台</h1><p>两种产线共用运行管理、工具网关与恢复判据。当前是软件沙箱；FUXA 工业画面后续通过 MQTT 接入。</p><section class="controls"><label>产线<select id="scene"><option value="glue">点胶线</option><option value="filling">灌装线</option></select></label><label>操作者故障注入<select id="fault"><option value="clog">出口堵塞</option><option value="supply">供料不足</option><option value="camera">镜头退化</option><option value="persistent">不可自动修复</option><option value="normal">正常</option></select></label><label>运行模式<select id="mode"><option value="offline">离线规则对照</option><option value="llm">语言模型工具调用</option></select></label><button class="primary" id="run">注入并运行</button><button id="stop">请求停止</button><span id="status">就绪</span></section><small>故障注入只用于操作者设置测试，故障标签不进入 Agent 工具。离线模式不计为真实 LLM Agent 效果。</small><section><h2>动作前后证据</h2><div id="evidence">运行后显示实际采集的 PNG。</div></section><section><h2>事件与工单</h2><div id="events"></div></section><section><h2>执行轨迹</h2><div id="trace"></div></section></main><script>const $=id=>document.getElementById(id);async function api(url,data){const r=await fetch(url,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const j=await r.json();if(!r.ok)throw Error(j.detail||'request failed');return j}function text(tag,s){const e=document.createElement(tag);e.textContent=s;return e}function show(r){$('status').textContent=r.status+' · '+r.mode;$('trace').replaceChildren();for(const t of r.trace){const d=document.createElement('details');d.append(text('summary',t.seq+' · '+t.role+' → '+t.tool),text('pre',JSON.stringify({arguments:t.arguments,result:t.result},null,2)));$('trace').append(d)}const frames=r.trace.flatMap(t=>t.result.observations|| (t.result.frame?[t.result]:[]));$('evidence').replaceChildren();for(const o of [frames[0],frames.at(-1)].filter(Boolean)){const f=document.createElement('figure'),i=document.createElement('img');i.src=o.frame;i.alt='产线采集图像';f.append(i,text('figcaption',o.measurement.metric+': '+o.measurement.value+' · quality '+o.measurement.quality+' · version '+o.version));$('evidence').append(f)}$('events').replaceChildren(text('p',r.id+' · '+r.status),text('p',r.orders.length?'工单：'+r.orders.map(o=>o.id+' '+o.reason).join('; '):'无工单'));} $('run').onclick=async()=>{$('run').disabled=true;$('status').textContent='执行中';try{await api('/api/operator/configure',{scene:$('scene').value,fault:$('fault').value});show(await api('/api/incidents',{mode:$('mode').value}))}catch(e){$('status').textContent=e.message}finally{$('run').disabled=false}};$('stop').onclick=async()=>{try{await api('/api/stop',{});$('status').textContent='已请求停止'}catch(e){$('status').textContent=e.message}};api('/api/incidents').then(rows=>{if(rows.length)api('/api/incidents/'+rows[0].id).then(show)});</script></html>
